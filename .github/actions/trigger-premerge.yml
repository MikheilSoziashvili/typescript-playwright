name: Trigger Premerge Checks Workflow
description: Custom action to trigger the Premerge Checks workflow
inputs:
  GITHUB_TOKEN:
    description: "GitHub token to authenticate API requests"
    required: true
  workflow_id:
    description: "ID or filename of the workflow to trigger"
    required: true
  ref:
    description: "The branch or ref to run the workflow on"
    required: true
runs:
  using: "node16"
  main: "index.js"