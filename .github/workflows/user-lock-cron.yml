name: Trigger Expired Ban Auto-Lock

on:
    workflow_dispatch:

jobs:
    run-expired-ban-auto-lock:
        runs-on: self-hosted-k8s
        timeout-minutes: 30
        steps:
            - name: Run expired ban auto-lock
              env:
                  KUBECONFIG_STG_OVH: ${{ secrets.KUBECONFIG_STG_OVH }}
              run: |
                  set -xeuo pipefail
                  echo "$KUBECONFIG_STG_OVH" > .kubeconfig
                  chmod 600 .kubeconfig
                  export KUBECONFIG=.kubeconfig

                  POD=$(kubectl get pod \
                    -n staging \
                    -l "app.kubernetes.io/instance=fixed-e2e-release" \
                    --no-headers | grep "app" | awk '{print $1}')

                  if [ -z "$POD" ]; then
                    echo "No app pod found"
                    exit 1
                  fi

                  echo "Found pod: ${POD}"
                  kubectl exec "$POD" -n staging -- yarn auto-lock-expired-bans
