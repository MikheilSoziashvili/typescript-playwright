name: Playwright Visual Tests - CI Images

on:
    workflow_dispatch:
        inputs:
            environment:
                description: "Environment to run tests against"
                type: choice
                required: true
                options:
                    - qa
                    - staging
                    - custom
            env_url:
                description: "Custom Environment URL (required if environment=custom)"
                type: string
                required: false
            tag:
                description: "Tag scope"
                required: true
                default: "visual"
                type: choice
                options:
                    - visual
            custom_options:
                description: "Custom command-line options"
                type: string
                required: false

concurrency:
    group: visual-tests-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write
    actions: write

jobs:
    visual-tests-images:
        timeout-minutes: 60
        runs-on: self-hosted-dind-playwright
        environment: ${{ ((inputs.environment || 'staging') == 'custom' && null) || (inputs.environment || 'staging') }}

        env:
            CI: ""
            BUILD_NUMBER: ${{ github.run_number }}
            BUILD_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
            JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
            XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
            XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
            STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
            STEAM_BANNED_USERNAME: ${{ secrets.STEAM_BANNED_USERNAME }}
            BANNED_STEAM_USER: ${{ secrets.BANNED_STEAM_USER }}
            STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
            GOOGLE_EMAIL: ${{ secrets.GOOGLE_EMAIL }}
            GOOGLE_PASSWORD: ${{ secrets.GOOGLE_PASSWORD }}
            GOOGLE_AUTH_SECRET: ${{ secrets.GOOGLE_AUTH_SECRET }}
            OXYLABS_USER: ${{ secrets.OXYLABS_USER }}
            OXYLABS_PASSWORD: ${{ secrets.OXYLABS_PASSWORD }}
            E2E_HOT_WALLET_CONFIG_ADMIN_API_KEY: ${{ secrets.E2E_HOT_WALLET_CONFIG_ADMIN_API_KEY }}
            ENVIRONMENT_URL: >-
                ${{
                  (inputs.environment || 'staging') == 'custom'
                    && inputs.env_url
                  || inputs.env_url
                  || vars.ENVIRONMENT_URL
                }}
            SLACK_BOT_USER_OAUTH_TOKEN: ${{ secrets.SLACK_BOT_USER_OAUTH_TOKEN }}
            SLACK_CRYPTO_LOW_WALLET_BALANCE_E2E_BOT_TOKEN: ${{secrets.SLACK_CRYPTO_LOW_WALLET_BALANCE_E2E_BOT_TOKEN}}
            OAUTH2_JWT: ${{ secrets.OAUTH2_JWT }}
            DB_HOST: ${{ secrets.DB_HOST }}
            DB_USER: ${{ secrets.DB_USER }}
            DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
            DB_NAME: ${{ secrets.DB_NAME }}
            DB_PORT: ${{ secrets.DB_PORT }}
            BITCOIN_RPC_HOST: ${{ secrets.BITCOIN_RPC_HOST }}
            BITCOIN_RPC_PORT: ${{ secrets.BITCOIN_RPC_PORT }}
            BITCOIN_RPC_USER: ${{ secrets.BITCOIN_RPC_USER }}
            BITCOIN_RPC_PASS: ${{ secrets.BITCOIN_RPC_PASS }}
            FIREBLOCKS_API_KEY: ${{ secrets.FIREBLOCKS_API_KEY }}
            FIREBLOCKS_BASE_URL: ${{ vars.FIREBLOCKS_BASE_URL }}
            FIREBLOCKS_SECRET_KEY: ${{ secrets.FIREBLOCKS_SECRET_KEY }}
            FIREBLOCKS_SECRET_KEY_PATH: ${{ secrets.FIREBLOCKS_SECRET_KEY_PATH }}
            FIREBLOCKS_USDT_ASSET_ID: ${{ secrets.FIREBLOCKS_USDT_ASSET_ID }}
            FIREBLOCKS_VAULT_ID: ${{ vars.FIREBLOCKS_VAULT_ID }}
            TAG: ${{ inputs.tag == '' && 'visual' || inputs.tag }}
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_DEFAULT_REGION: eu-west-2
            XRP_TESTNET_WALLET_SEED: ${{ secrets.XRP_TESTNET_WALLET_SEED }}
            XRP_TESTNET_WALLET_SEED_WORKER_0: ${{ secrets.XRP_TESTNET_WALLET_SEED_WORKER_0 }}
            XRP_TESTNET_WALLET_SEED_WORKER_1: ${{ secrets.XRP_TESTNET_WALLET_SEED_WORKER_1 }}
            XRP_TESTNET_WALLET_SEED_WORKER_2: ${{ secrets.XRP_TESTNET_WALLET_SEED_WORKER_2 }}
            XRP_TESTNET_WALLET_SEED_WORKER_3: ${{ secrets.XRP_TESTNET_WALLET_SEED_WORKER_3 }}
            XRP_TESTNET_WALLET_SEED_WORKER_4: ${{ secrets.XRP_TESTNET_WALLET_SEED_WORKER_4 }}
            XRP_TESTNET_RPC_URL: ${{ vars.XRP_TESTNET_RPC_URL }}
            XRP_TESTNET_FAUCET_URL: ${{ vars.XRP_TESTNET_FAUCET_URL }}
            LITECOIN_RPC_PORT: ${{ vars.LITECOIN_RPC_PORT }}
            FIREBLOCKS_ETH_ASSET_ID: ${{ vars.FIREBLOCKS_ETH_ASSET_ID }}
            FIREBLOCKS_SOL_ASSET_ID: ${{ vars.FIREBLOCKS_SOL_ASSET_ID }}
            FIREBLOCKS_TRX_ASSET_ID: ${{ vars.FIREBLOCKS_TRX_ASSET_ID }}
            FIREBLOCKS_USDT_TRX_ASSET_ID: ${{ vars.FIREBLOCKS_USDT_TRX_ASSET_ID }}
            FIREBLOCKS_USD1_ETH_ASSET_ID: ${{ secrets.FIREBLOCKS_USD1_ETH_ASSET_ID }}
            FIREBLOCKS_USD1_SOL_ASSET_ID: ${{ secrets.FIREBLOCKS_USD1_SOL_ASSET_ID }}
            FIREBLOCKS_USDT_BSC_ASSET_ID: ${{ secrets.FIREBLOCKS_USDT_BSC_ASSET_ID }}
            FIREBLOCKS_USDC_BSC_ASSET_ID: ${{ secrets.FIREBLOCKS_USDC_BSC_ASSET_ID }}
            FIREBLOCKS_BNB_ASSET_ID: ${{ secrets.FIREBLOCKS_BNB_ASSET_ID }}
            VERIFF_PUBLISHABLE_KEY: ${{ vars.VERIFF_PUBLISHABLE_KEY }}
            VERIFF_PRIVATE_KEY: ${{ secrets.VERIFF_PRIVATE_KEY }}
            VERIFF_USERNAME: ${{ vars.VERIFF_USERNAME }}
            VERIFF_PASSWORD: ${{ secrets.VERIFF_PASSWORD }}
            VERIFF_SECRET_2FA: ${{ secrets.VERIFF_SECRET_2FA }}
            FIREBLOCKS_USDC_ETH_ASSET_ID: ${{ vars.FIREBLOCKS_USDC_ETH_ASSET_ID }}
            FIREBLOCKS_USDC_SOL_ASSET_ID: ${{ vars.FIREBLOCKS_USDC_SOL_ASSET_ID }}
            DOGE_TESTNET_ADDRESS: ${{ vars.DOGE_TESTNET_ADDRESS }}
            DOGE_TESTNET_PRIVATE_KEY: ${{ secrets.DOGE_TESTNET_PRIVATE_KEY }}

        steps:
            - name: Validation For Environment URL
              run: |
                  echo "Validating that Environment URL is valid format (and does not end with slash)"
                  echo $ENVIRONMENT_URL | grep -E '^(http|https)://[a-zA-Z0-9./?=_-]*[^/]$'

            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.ref }}

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y git curl

            - name: Install Node.js dependencies
              run: |
                  set -euo pipefail
                  corepack enable
                  yarn install --immutable

            - name: Install Playwright Browsers
              run: yarn playwright install --with-deps

            - name: Run Playwright tests with snapshot update
              run: yarn playwright test --grep "$TAG" --update-snapshots ${{ inputs.custom_options }}

            - name: Configure git for Pull Request update
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Commit and push updated snapshots
              run: |
                  git checkout -- keystore.json
                  git add .
                  git commit -m "Update visual snapshots for CI"
                  git push origin ${{ github.event.pull_request.head.ref }}
              if: success()

            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: playwright-report-${{ matrix.runs-on }}
                  path: playwright-report/
                  retention-days: 1
